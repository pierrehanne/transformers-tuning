minimum_pre_commit_version: "4.3.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: python-tests
        name: Python tests
        entry: uv run --frozen pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: uv-lock
        name: uv lock is current
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: docs-check
        name: Astro checks
        entry: npm --prefix site run check
        language: system
        pass_filenames: false
        files: ^site/
      - id: docs-build
        name: Astro production build
        entry: npm --prefix site run build
        language: system
        pass_filenames: false
        files: ^site/
        stages: [pre-push]

