[project]
name = "transformers-tuning"
version = "0.1.0"
description = "Runnable examples of parameter-efficient fine-tuning methods"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "accelerate>=1.10",
  "datasets>=4.0",
  "peft>=0.17",
  "torch>=2.7",
  "transformers>=4.55",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4.3",
  "pytest>=8.4",
  "ruff>=0.12",
]

[project.scripts]
peft-train = "transformers_tuning.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transformers_tuning"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
